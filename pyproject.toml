[project]
name = "fastapi-perfstats"
version = "0.1.0"
description = "Tiny per-route call statistics, slow-call log and stats page for Starlette/FastAPI apps"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "rt87", email = "rt87@users.noreply.github.com" }]
requires-python = ">=3.12"
keywords = ["starlette", "fastapi", "statistics", "metrics", "latency", "slow-calls", "asgi", "middleware"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: FastAPI",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
]
dependencies = ["starlette>=0.37"]

[project.urls]
Homepage = "https://github.com/rt87/fastapi-perfstats"
Repository = "https://github.com/rt87/fastapi-perfstats"
Issues = "https://github.com/rt87/fastapi-perfstats/issues"
Changelog = "https://github.com/rt87/fastapi-perfstats/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "fastapi>=0.110",
    "ruff>=0.6",
    "uvicorn>=0.30",
    "mypy>=2.4.1",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_perfstats"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"examples/*" = ["S104"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples"]

# Tests and the demo are short throwaway functions: annotating every one adds noise, not safety. They are still
# fully type-checked (check_untyped_defs); only the "must be annotated" rules are relaxed.
[[tool.mypy.overrides]]
module = [
    "test_all", "test_stats_route", "test_without_fastapi", "test_page_columns", "demo",
    "fakes", "test_contracts", "test_store_wiring", "test_hooks",
    "test_sqlite_schema", "test_mounts", "test_keys", "test_middleware_timing",
    "test_lifecycle", "test_headers", "test_auth", "test_reset",
    "test_ext_stddev", "test_slow_thresholds", "test_slow_context", "test_ext_sizes",
    "test_ext_recent", "test_live", "test_prometheus", "test_benchmark_smoke",
    "test_version", "test_integration",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fastapi_perfstats --cov-branch --cov-fail-under=95 --cov-report=term-missing"
