[project]
name = "fastapi-stats"
version = "0.1.0"
description = "Tiny per-route call statistics, slow-call log and stats page for Starlette/FastAPI apps (prototype)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "rt87", email = "rt87@users.noreply.github.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: FastAPI",
    "Development Status :: 3 - Alpha",
]
dependencies = ["starlette>=0.37"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "fastapi>=0.110",
    "ruff>=0.6",
    "uvicorn>=0.30",
    "mypy>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_stats"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"examples/*" = ["S104"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples"]

# Tests and the demo are short throwaway functions: annotating every one adds noise, not safety. They are still
# fully type-checked (check_untyped_defs); only the "must be annotated" rules are relaxed.
[[tool.mypy.overrides]]
module = ["test_all", "test_stats_route", "test_without_fastapi", "test_page_columns", "demo"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fastapi_stats --cov-branch --cov-fail-under=95 --cov-report=term-missing"
