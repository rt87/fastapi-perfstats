[project]
name = "fastapi-stats"
version = "0.1.0"
description = "Tiny per-route call statistics, slow-call log and stats page for Starlette/FastAPI apps (prototype)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "rt87", email = "rt87@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = ["starlette>=0.37"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "fastapi>=0.110", "ruff>=0.6", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_stats"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"examples/*" = ["S104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fastapi_stats --cov-report=term-missing"
