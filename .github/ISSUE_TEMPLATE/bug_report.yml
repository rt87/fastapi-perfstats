name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: starlette
    attributes:
      label: Starlette version
    validations:
      required: true
  - type: input
    id: fastapi
    attributes:
      label: FastAPI version (if used)
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
