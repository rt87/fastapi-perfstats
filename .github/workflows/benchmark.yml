name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overhead:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run python benchmarks/overhead.py | tee overhead.md
      - run: uv run python benchmarks/overhead.py --json > overhead.json
      - uses: actions/upload-artifact@v4
        with:
          name: overhead
          path: |
            overhead.md
            overhead.json
