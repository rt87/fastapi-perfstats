name: Benchmark

on:
  workflow_dispatch:
    inputs:
      n:
        description: Requests per repeat
        default: "20000"
      repeats:
        description: Repeats per scenario (median reported)
        default: "5"
      python:
        description: Python version
        default: "3.14"

permissions:
  contents: read

jobs:
  overhead:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: ${{ inputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python --version
      - run: uv run python benchmarks/overhead.py --n ${{ inputs.n }} --repeats ${{ inputs.repeats }} --json-file overhead.json | tee overhead.md
      - run: cat overhead.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: overhead
          path: |
            overhead.md
            overhead.json
